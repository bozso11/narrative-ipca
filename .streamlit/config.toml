# Streamlit settings of the topic-exposure lab dashboard (DESIGN.md G.9).
# Run from the repository root: .venv/Scripts/python.exe -m streamlit run dashboard/app.py

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2a78d6"

[runner]
fastReruns = true
